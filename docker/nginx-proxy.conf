# nginx-proxy.conf - reverse proxy + HTTPS (Let's Encrypt via certbot)
# Used by the commented `nginx` + `certbot` services in docker-compose.yml
# Mount: ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
#
# FIRST-TIME SETUP (nginx won't start if the cert files don't exist yet):
#   1. Comment out the whole `server { listen 443 ... }` block below
#   2. docker compose up -d nginx
#   3. docker compose run --rm --entrypoint certbot certbot certonly --webroot -w /var/www/certbot \
#        -d example.com -d www.example.com --email you@example.com --agree-tos --no-eff-email
#      (add --staging while testing to avoid Let's Encrypt rate limits)
#   4. Uncomment the 443 block, then: docker compose exec nginx nginx -s reload
#   Renewal is automatic (certbot service + nginx reloads every 6h).
#
# Test config: docker compose exec nginx nginx -t
# Replace every `example.com` with your domain.

upstream app_backend {
    server app:8080;
    keepalive 32;
    # Load balancing across replicas/services:
    # server app2:8080;
}

# WebSocket support: sets Connection header only when client asks for an upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Container healthcheck (used by compose)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://example.com$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;
    server_tokens off;

    # www -> apex
    if ($host = www.example.com) {
        return 301 https://example.com$request_uri;
    }

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;          # max upload size (default 1m)

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSockets (also fine for normal requests)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;     # raise for long requests / SSE / websockets (e.g. 3600s)
        # proxy_buffering off;         # Server-Sent Events / streaming responses
    }

    # Static frontend container + API on same domain:
    # location /api/ {
    #     proxy_pass http://app_backend/;      # trailing slash strips /api prefix
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location / {
    #     proxy_pass http://web:80;
    # }

    # Protect an admin area with basic auth
    # (create file: docker run --rm httpd:alpine htpasswd -nbB admin 'secret' > .htpasswd, mount to /etc/nginx/.htpasswd)
    # location /admin/ {
    #     auth_basic "Restricted";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://app_backend;
    # }

    # Simple rate limit (also add in http context: limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;)
    # location /api/login {
    #     limit_req zone=api burst=20 nodelay;
    #     proxy_pass http://app_backend;
    # }
}

# ---- Second app on a subdomain: copy the 443 block, change server_name/cert/upstream ----
# Certbot: add -d api.example.com (or issue a separate cert)

# ---- Behind Cloudflare proxy (orange cloud) ----
# SSL/TLS mode must be "Full (strict)". Restore real client IPs:
# set_real_ip_from 173.245.48.0/20;   # full list: https://www.cloudflare.com/ips/
# set_real_ip_from 103.21.244.0/22;
# real_ip_header CF-Connecting-IP;
# Alternative to Let's Encrypt: Cloudflare Origin Certificate (15 years, valid only behind CF)

# ---- If nginx fails with "host not found in upstream" when app is down ----
# Resolve at request time via Docker DNS instead of at startup (replace proxy_pass in location /):
#   resolver 127.0.0.11 valid=10s;
#   set $app_upstream http://app:8080;
#   proxy_pass $app_upstream;
