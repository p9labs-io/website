# nginx-static.conf - static site / SPA server (used by Dockerfile.node --target static)
# COPY nginx-static.conf /etc/nginx/conf.d/default.conf
# nginx-unprivileged image: change `listen 80` -> `listen 8080`
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Content-Security-Policy "default-src 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # only behind HTTPS

    # ---- Hashed build assets: cache forever ----
    # GOTCHA: any add_header inside a location DROPS all server-level add_header -> repeat them
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- index.html: never cache (so new deploys are picked up) ----
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- SPA fallback (client-side routing). Static multi-page site: use `try_files $uri $uri/ =404;` ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API reverse proxy (avoid CORS) ----
    # location /api/ {
    #     proxy_pass http://app:8080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     # WebSockets:
    #     # proxy_set_header Upgrade $http_upgrade;
    #     # proxy_set_header Connection "upgrade";
    # }

    # ---- Health endpoint for HEALTHCHECK / load balancers ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Deny dotfiles (.git, .env)
    location ~ /\. {
        deny all;
    }
}
