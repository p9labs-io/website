# Modern filename: compose.yaml (docker-compose.yml still works)
# Dev overrides go in compose.override.yaml (auto-merged)
name: myproject

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # target: runtime
      # args:
      #   VERSION: "1.0.0"
      # platforms: [linux/amd64, linux/arm64]
    image: app:latest
    # container_name: app_service    # blocks --scale and clashes across projects
    restart: unless-stopped
    init: true                       # proper signal handling / zombie reaping
    # pull_policy: build
    env_file:
      - path: .env
        required: false
    environment:
      APP_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      # DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-appdb}
    ports:
      - "127.0.0.1:8080:8080"        # localhost only; use "8080:8080" to expose publicly
    # expose:
    #   - "8080"                     # internal only (behind reverse proxy)
    depends_on:
      db:
        condition: service_healthy
        # restart: true              # restart app when db restarts
    networks:
      - internal_network
      - public_network
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"   # reach host services from container (Linux)
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
      # replicas: 2                  # remove container_name + host port to scale
    logging: *default-logging
    # stop_grace_period: 30s
    # volumes:
    #   - ./:/app:ro
    #   - ./data:/app/data
    # ---- Hardening ----
    # user: "1000:1000"
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - NET_BIND_SERVICE           # only if binding port < 1024
    # read_only: true
    # tmpfs:
    #   - /tmp
    # ---- Secrets (file-based, mounted at /run/secrets/<name>) ----
    # secrets:
    #   - db_password
    # ---- Dev hot reload: `docker compose watch` ----
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./src
    #       target: /app/src
    #     - action: rebuild
    #       path: requirements.txt

  db:
    image: postgres:18-alpine
    # container_name: app_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # use INSTEAD of POSTGRES_PASSWORD
      # POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql             # postgres 18+ layout
      # - pgdata:/var/lib/postgresql/data      # postgres <= 17
      # Major upgrade (e.g. 17 -> 18) needs pg_dump/restore or pg_upgrade - just bumping the tag won't start
      # - ./init-scripts:/docker-entrypoint-initdb.d:ro   # *.sql / *.sh run on first init only
    # ports:
    #   - "127.0.0.1:5432:5432"      # access from host (psql, GUI clients)
    networks:
      - internal_network
    shm_size: 256mb                  # default 64mb is too small for larger queries
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    # secrets:
    #   - db_password

  # redis:
  #   image: redis:8-alpine
  #   restart: unless-stopped
  #   command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
  #   volumes:
  #     - redisdata:/data
  #   networks:
  #     - internal_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

  # adminer:                         # DB web UI; start with: docker compose --profile debug up -d
  #   image: adminer
  #   profiles: ["debug"]
  #   ports:
  #     - "127.0.0.1:8081:8080"
  #   networks:
  #     - internal_network
  #     - public_network

  # ---- Reverse proxy + HTTPS (template: nginx-proxy.conf, read its FIRST-TIME SETUP) ----
